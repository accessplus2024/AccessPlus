<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <title>Filterable Cards</title>
</head>

<body class="bg-purple-50">

    <section class="flex justify-center mt-10">
        <div class="w-3/4 bg-purple-100 p-8 rounded-md shadow-lg">
            <div class="mb-4 relative">
                <input type="text" id="searchInput" class="w-full p-4 text-lg rounded-md border border-purple-300 focus:outline-none focus:ring-2 focus:ring-purple-500"
                    placeholder="Bolsas para ensino médio">
                <button id="searchButton" class="absolute right-0 top-0 h-full bg-yellow-400 text-purple-700 px-4 rounded-md">Pesquisar</button>
            </div>
            <div class="flex justify-between items-center space-x-6">
                <div class="flex space-x-6">
                    <div>
                        <label class="block text-purple-700 font-semibold mb-2">Público Alvo</label>
                        <div class="flex flex-wrap gap-2">
                            <span class="filter bg-purple-300 text-purple-700 py-1 px-3 rounded-md cursor-pointer" data-filter="negras">Negros</span>
                            <span class="filter bg-purple-300 text-purple-700 py-1 px-3 rounded-md cursor-pointer" data-filter="lgbt">LGBT</span>
                            <span class="filter bg-purple-300 text-purple-700 py-1 px-3 rounded-md cursor-pointer" data-filter="baixa renda">Baixa Renda</span>
                            <span class="filter bg-purple-300 text-purple-700 py-1 px-3 rounded-md cursor-pointer" data-filter="indígenas">Indígenas</span>
                            <span class="filter bg-purple-300 text-purple-700 py-1 px-3 rounded-md cursor-pointer" data-filter="deficientes">Deficientes</span>
                            <span class="filter bg-purple-300 text-purple-700 py-1 px-3 rounded-md cursor-pointer" data-filter="pública política">Pública Política</span>
                        </div>
                    </div>
                    <div class="border-l-2 border-purple-300 pl-4">
                        <label class="block text-purple-700 font-semibold mb-2">Interesses</label>
                        <div class="flex flex-wrap gap-2">
                            <span class="filter bg-purple-300 text-purple-700 py-1 px-3 rounded-md cursor-pointer" data-filter="stem">STEM</span>
                            <span class="filter bg-purple-300 text-purple-700 py-1 px-3 rounded-md cursor-pointer" data-filter="meio ambiente">Meio Ambiente</span>
                            <span class="filter bg-purple-300 text-purple-700 py-1 px-3 rounded-md cursor-pointer" data-filter="artes">Artes</span>
                            <span class="filter bg-purple-300 text-purple-700 py-1 px-3 rounded-md cursor-pointer" data-filter="humanas">Humanas</span>
                            <span class="filter bg-purple-300 text-purple-700 py-1 px-3 rounded-md cursor-pointer" data-filter="linguagens">Linguagens</span>
                        </div>
                    </div>
                    <div class="border-l-2 border-purple-300 pl-4">
                        <label class="block text-purple-700 font-semibold mb-2">Custo</label>
                        <div class="flex flex-wrap gap-2">
                            <span class="filter bg-purple-300 text-purple-700 py-1 px-3 rounded-md cursor-pointer" data-filter="gratuito">Gratuito</span>
                            <span class="filter bg-purple-300 text-purple-700 py-1 px-3 rounded-md cursor-pointer" data-filter="bolsas">Bolsas</span>
                        </div>
                    </div>
                    <div class="border-l-2 border-purple-300 pl-4">
                        <label class="block text-purple-700 font-semibold mb-2">Localização</label>
                        <div class="flex flex-wrap gap-2">
                            <span class="filter bg-purple-300 text-purple-700 py-1 px-3 rounded-md cursor-pointer" data-filter="nacional">Nacional</span>
                            <span class="filter bg-purple-300 text-purple-700 py-1 px-3 rounded-md cursor-pointer" data-filter="internacional">Internacional</span>
                            <span class="filter bg-purple-300 text-purple-700 py-1 px-3 rounded-md cursor-pointer" data-filter="online">Online</span>
                            <span class="filter bg-purple-300 text-purple-700 py-1 px-3 rounded-md cursor-pointer" data-filter="cidades">Cidades</span>
                        </div>
                    </div>
                    <div class="border-l-2 border-purple-300 pl-4">
                        <label class="block text-purple-700 font-semibold mb-2">Oportunidades</label>
                        <div class="flex flex-wrap gap-2">
                            <span class="filter bg-purple-300 text-purple-700 py-1 px-3 rounded-md cursor-pointer" data-filter="educação">Educação</span>
                            <span class="filter bg-purple-300 text-purple-700 py-1 px-3 rounded-md cursor-pointer" data-filter="voluntariado">Voluntariado</span>
                            <span class="filter bg-purple-300 text-purple-700 py-1 px-3 rounded-md cursor-pointer" data-filter="competição">Competição</span>
                            <span class="filter bg-purple-300 text-purple-700 py-1 px-3 rounded-md cursor-pointer" data-filter="campos">Campos</span>
                            <span class="filter bg-purple-300 text-purple-700 py-1 px-3 rounded-md cursor-pointer" data-filter="liderança">Liderança</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="flex flex-wrap justify-center mt-10">
        <a href="sakura.html" class="card max-w-xs mx-auto border border-gray-300 hover:shadow-2xl transition-shadow duration-300" data-tags="internacional stem gratuito">
            <div class="relative">
                <img src="sakura.png" alt="Group of young ambassadors in front of the Golden Gate Bridge holding a Brazilian flag" class="w-full h-auto">
                <div class="absolute inset-0 bg-purple-900 bg-opacity-50 p-4 text-white flex flex-col justify-end">
                    <div class="mb-2">
                        <h2 class="text-lg font-bold">Sakura Science High School Program</h2>
                        <p class="text-sm">Japan Science and Technology Agency</p>
                    </div>
                    <div class="flex space-x-2">
                        <button class="flex-1 bg-purple-700 text-white text-xs py-2">INTERNACIONAL</button>
                        <button class="flex-1 bg-sky-700 text-white text-xs py-2">STEM</button>
                    </div>
                </div>
            </div>
        </a>
        <!-- Add more cards as needed -->
         
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const filters = document.querySelectorAll('.filter');
            const cards = document.querySelectorAll('.card');
            const activeFilters = new Set();

            filters.forEach(filter => {
                filter.addEventListener('click', () => {
                    const filterValue = filter.getAttribute('data-filter');
                    if (activeFilters.has(filterValue)) {
                        activeFilters.delete(filterValue);
                        filter.classList.remove('bg-purple-500');
                    } else {
                        activeFilters.add(filterValue);
                        filter.classList.add('bg-purple-500');
                    }
                    updateCards();
                });
            });

            function updateCards() {
                cards.forEach(card => {
                    const cardTags = card.getAttribute('data-tags').split(' ');
                    const isMatch = [...activeFilters].every(filter => cardTags.includes(filter));
                    if (isMatch) {
                        card.classList.remove('hidden');
                    } else {
                        card.classList.add('hidden');
                    }
                });
            }

            document.getElementById('searchButton').addEventListener('click', () => {
                const searchInput = document.getElementById('searchInput').value.toLowerCase();
                cards.forEach(card => {
                    const cardTitle = card.querySelector('h2').textContent.toLowerCase();
                    const cardDesc = card.querySelector('p').textContent.toLowerCase();
                    if (cardTitle.includes(searchInput) || cardDesc.includes(searchInput)) {
                        card.classList.remove('hidden');
                    } else {
                        card.classList.add('hidden');
                    }
                });
            });
        });
    </script>
</body>

</html>
