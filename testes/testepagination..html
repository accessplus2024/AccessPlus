<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagination Example</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pagination a {
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col items-center h-screen p-10">

    <!-- Pagination Container -->
    <div id="content-container" class="w-full max-w-md mb-10">
        <!-- Dynamic Content Here -->
    </div>

    <!-- Pagination Controls -->
    <div class="pagination flex space-x-2 text-gray-700">
        <a id="prev" class="px-3 py-1 border rounded-l-lg bg-white hover:bg-gray-200">&lt;</a>
        <a id="page-1" class="px-3 py-1 border rounded-full bg-green-900 text-white">1</a>
        <a id="page-2" class="px-3 py-1 border bg-white hover:bg-gray-200">2</a>
        <a id="page-3" class="px-3 py-1 border bg-white hover:bg-gray-200">3</a>
        <a id="page-4" class="px-3 py-1 border bg-white hover:bg-gray-200">4</a>
        <a id="page-5" class="px-3 py-1 border bg-white hover:bg-gray-200">5</a>
        <span class="px-3 py-1 border bg-white">...</span>
        <a id="page-last" class="px-3 py-1 border bg-white hover:bg-gray-200">5098</a>
        <a id="next" class="px-3 py-1 border rounded-r-lg bg-white hover:bg-gray-200">&gt;</a>
    </div>

    <script>
        const pages = document.querySelectorAll('.pagination a');
        let currentPage = 1;

        const contentData = [
            `
            <!-- Olympiad 1 -->
            <div class="bg-white shadow-lg rounded-lg overflow-hidden border-t-4 border-sky-700 hover:bg-sky-100 transition-colors duration-300" data-tags="biologia stem nacional">
                <div class="p-4">
                    <img src="obsma.png" alt="Olympiad logo" class="w-full h-32 object-contain">
                    <h3 class="text-xl font-bold mt-4">OBSMA</h3>
                    <p class="text-gray-600">Olimpíada Brasileira de Meio Ambiente e Saúde da Fiocruz</p>
                    <div class="flex mt-2">
                        <span class="bg-sky-200 text-sky-900 text-xs font-semibold mr-2 px-2.5 py-0.5 rounded">BIOLOGIA</span>
                        <span class="bg-blue-200 text-blue-800 text-xs font-semibold mr-2 px-2.5 py-0.5 rounded">NATIONAL</span>
                    </div>
                    <div class="flex items-center mt-4">
                        <img src="stars.png" alt="stars avatar" class="w-8 h-8 rounded-full">
                        <a href="obsma.html" class="text-gray-600 ml-2 text-sm font-bold hover:text-sky-800">Learn more</a>
                    </div>
                </div>
            </div>
            `,
            `
            <!-- Olympiad 2 -->
            <div class="bg-white shadow-lg rounded-lg overflow-hidden border-t-4 border-sky-700 hover:bg-sky-100 transition-colors duration-300" data-tags="biologia stem nacional">
                <div class="p-4">
                    <img src="vitalis.png" alt="Olympiad logo" class="w-full h-32 object-contain">
                    <h3 class="text-xl font-bold mt-4">VITALIS</h3>
                    <p class="text-gray-600">Olímpiada Vitalis</p>
                    <div class="flex mt-2">
                        <span class="bg-sky-200 text-sky-900 text-xs font-semibold mr-2 px-2.5 py-0.5 rounded">BIOLOGIA</span>
                        <span class="bg-blue-200 text-blue-800 text-xs font-semibold mr-2 px-2.5 py-0.5 rounded">NATIONAL</span>
                    </div>
                    <div class="flex items-center mt-4">
                        <img src="stars.png" alt="stars avatar" class="w-8 h-8 rounded-full">
                        <a href="vitalis.html" class="text-gray-600 ml-2 text-sm font-bold hover:text-sky-800">Learn more</a>
                    </div>
                </div>
            </div>
            `
            // Add more content strings for each page as needed
        ];

        function updatePagination(newPage) {
            currentPage = newPage;
            pages.forEach(page => {
                if (parseInt(page.innerText) === currentPage) {
                    page.classList.add('bg-green-900', 'text-white');
                    page.classList.remove('bg-white', 'hover:bg-gray-200');
                } else {
                    page.classList.remove('bg-green-900', 'text-white');
                    page.classList.add('bg-white', 'hover:bg-gray-200');
                }
            });
            document.getElementById('content-container').innerHTML = contentData[currentPage - 1];
        }

        pages.forEach(page => {
            page.addEventListener('click', () => {
                const pageNumber = parseInt(page.innerText);
                if (!isNaN(pageNumber)) {
                    updatePagination(pageNumber);
                } else if (page.id === 'prev' && currentPage > 1) {
                    updatePagination(currentPage - 1);
                } else if (page.id === 'next' && currentPage < contentData.length) {
                    updatePagination(currentPage + 1);
                }
            });
        });

        // Initialize the content with the first page
        updatePagination(1);

    </script>
</body>
</html>
